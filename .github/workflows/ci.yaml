on:
  push:
    branches: [ main ]

# concurrency:
#   group: release
#   cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go mod download

      - run: |
          git config user.name "SemRel Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go tool semrel release --github-output
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: printf "semrel outputs %s" "${OUTPUT_JSON}"
        env:
          OUTPUT_JSON: ${{ toJSON(steps.semrel.outputs) }}

      - if: steps.semrel.outputs.released == 'true'
        name: Push CHANGELOG and prep release notes
        run: |
          ls -alF
          git push origin main
          printf "%s" "${{ steps.semrel.outputs.changelog }}" > .RELEASE-NOTES.md

      - if: steps.semrel.outputs.released == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          # # either 'goreleaser' (default) or 'goreleaser-pro'
          # distribution: goreleaser
          # # 'latest', 'nightly', or a semver
          # version: "~> v2"
          args: release --clean --release-notes .RELEASE-NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}